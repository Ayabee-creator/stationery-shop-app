# ===== LOCAL DEVELOPMENT =====
# Copy this file to application.properties and fill in your MySQL password
#
# spring.datasource.url=jdbc:mysql://localhost:3306/stationery_shop
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# server.port=8080

# ===== CLOUD DEPLOYMENT (Railway/Render) =====
# Set these as environment variables on your hosting platform:
#
# DATABASE_URL=jdbc:mysql://your-cloud-host:3306/stationery_shop
# DATABASE_USER=your_db_username
# DATABASE_PASSWORD=your_db_password
# PORT=8080 (Railway sets this automatically)
