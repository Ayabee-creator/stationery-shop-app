# Stationery Shop Backend - Application Properties
# These use environment variables for cloud deployment (Railway, Render, etc.)
# If env vars are not set, falls back to local defaults

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/stationery_shop}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=${PORT:8080}

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
